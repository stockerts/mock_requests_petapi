name: On-Demand - Bank API Request Generation - Dev

on:
  workflow_dispatch:

jobs:
  bank-request-generation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Bank API Requests
      env:
        bank_credentials: ${{ secrets.bank_credentials }}
      run: |
        # Start run

        # Variables file location
        source ./variables_bank.sh

        # Set number of Iterations
        iterations=$iterations
        for ((i=1; i<=iterations; i++)); do
        # Display the current iteration number
        echo "Iteration: $i"

          # Reset credential rotation for this iteration
          cred_index=0
          mapfile -t creds <<< "$bank_credentials"

          # Curl Block

          # Create variable matches for method, url and body from endpoints file
          while IFS='|' read -r method path body; do

          # Create variable for time
          timestamp=$(TZ="America/Los_Angeles" date "+%H:%M:%S")

          # Create URL
          url="$protocol://$domain$path"

          # Encode spaced within url, create encoded_url variable
          encoded_url="${url// /%20}"

          # Request Match login endpoint, capture token, create token variable
          if [[ "$encoded_url" == */login ]]; then
            cred="${creds[$cred_index]}"
            cred_user="${cred%%:*}"
            cred_pass="${cred#*:}"
            login_body="{\"username\": \"$cred_user\", \"password\": \"$cred_pass\"}"
            response=$(curl -s -X "$method" "$encoded_url" -H "Content-Type: application/json" -d "$login_body")
            token=$(echo "$response" | jq -r '.token')  # Extract the token value from the response
            echo "[$timestamp PST] $method to $encoded_url : login"
            cred_index=$((cred_index + 1))
            continue
          fi

          # Request Match getactivity endpoint, use token variable
          if [[ "$encoded_url" == *"/getactivity"* ]]; then
            if [[ "$method" == "POST" ]]; then
              response_code=$(curl -o /dev/null -s -w "%{http_code}" -X "$method" "$encoded_url" -H "Content-Type: application/json" -H "Authorization: Bearer $token" -d "$body")
            else
              response_code=$(curl -o /dev/null -s -w "%{http_code}" -X "$method" "$encoded_url" -H "Authorization: Bearer $token")
            fi
            echo "[$timestamp PST] $method to $encoded_url : $response_code"
            continue
          fi

          # Requests for all other endpoints
          if [[ "$method" == "POST" || "$method" == "PUT" ]]; then
            response_code=$(curl -o /dev/null -s -w "%{http_code}" -X "$method" "$encoded_url" -H "Content-Type: application/json" -d "$body")
            echo "[$timestamp PST] $method to $encoded_url : $response_code"
          else
            response_code=$(curl -o /dev/null -s -w "%{http_code}" -X "$method" "$encoded_url")
            echo "[$timestamp PST] $method to $encoded_url : $response_code"
          fi

          # Add delayed between requests
          sleep $delay

          # End Curl block, set endpoints file
          done < endpoints_bank.txt

        #End iterations block
        done
